<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1b17">
<title>Pythomon — Serpentia</title>
<meta name="description" content="A small Game Boy style RPG that teaches Python. Build a team of pythomon, solve Python puzzles, and close the loop.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230b2a26'/%3E%3Cpath d='M4 11c0-3 2-4 4-4s4-1 4-4' fill='none' stroke='%23e8b93b' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='3' r='1.6' fill='%23f8f0cf'/%3E%3C/svg%3E">
</head>
<body>
<div class="page">
  <main id="frame" class="console" aria-label="Pythomon game">
    <header class="console-top">
      <div class="wordmark">PYTHOMON <span>Serpentia</span></div>
      <div class="power"><i class="led" aria-hidden="true"></i> POWER</div>
    </header>

    <div class="bezel">
      <div class="bezel-inner">
        <canvas id="game" width="160" height="144" role="img"
          aria-label="Pythomon game screen. Use the arrow keys or WASD to move, Z or Enter for A, X or Escape for B, and Tab for the menu."></canvas>
      </div>
      <div class="bezel-caption"><span>DOT MATRIX</span><span>5 TYPES · ONE LOOP</span></div>
    </div>

    <div class="controls">
      <div class="dpad" id="dpad" aria-label="Direction pad">
        <button class="pad up" data-key="up" aria-label="Move up"><span></span></button>
        <button class="pad left" data-key="left" aria-label="Move left"><span></span></button>
        <span class="pad-hub" aria-hidden="true"></span>
        <button class="pad right" data-key="right" aria-label="Move right"><span></span></button>
        <button class="pad down" data-key="down" aria-label="Move down"><span></span></button>
      </div>

      <div class="meta-controls">
        <button class="pill" data-key="start" aria-label="Open the game menu">START</button>
        <button class="pill ghost" id="soundBtn" type="button" aria-label="Toggle sound">SOUND</button>
      </div>

      <div class="actions" id="buttons">
        <button class="round b" data-key="b" aria-label="B button">B</button>
        <button class="round a" data-key="a" aria-label="A button">A</button>
      </div>
    </div>

    <footer class="console-foot">
      <span><b>MOVE</b> arrows / wasd</span>
      <span><b>A</b> z / enter</span>
      <span><b>B</b> x / esc</span>
      <span><b>MENU</b> tab</span>
    </footer>
  </main>

  <p class="outside-hint">A Python adventure in the Serpentia region.</p>
</div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
